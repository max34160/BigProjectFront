<div class="page-wrapper">
  <h1 class="page-title">Mon profil</h1>

  <div class="avatar-section">
    <div class="avatar-wrapper">
      <div class="avatar-circle">
        <mat-icon class="avatar-icon">person</mat-icon>
      </div>
    </div>
  </div>

  <p class="section-label">Mes informations personnelles :</p>

  <form class="profil-form">
    <mat-form-field appearance="outline" class="full-width">
      <input matInput [value]="global.user?.nom || ''" placeholder="Prénom" readonly>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <input matInput [value]="global.user?.prenom || ''" placeholder="Nom" readonly>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <input matInput [value]="global.user?.age ? global.user.age + ' ans' : ''" placeholder="Âge" readonly>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <input matInput [value]="global.user?.email || ''" placeholder="Email" readonly>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <input matInput type="password" value="placeholder_password" placeholder="Mot de passe" readonly>
    </mat-form-field>
  </form>

  <button mat-flat-button class="btn-valider">Valider</button>
</div>
