<div class="profil-container" >
  <h1 class="profil-title">Profil</h1>

  <p class="profil-firstname">
    {{global.user.nom}}
  </p>
  <button [routerLink]="['/update-profil', global.user?.id_user]">Modifier le profil</button>

  <p class="profil-name">
    {{global.user.premon}}
  </p>

  <p class="profil-age">
    {{global.user.age}}
  </p>

  <p class="profil-email">
    {{global.user.email}}
  </p>
  
</div>
