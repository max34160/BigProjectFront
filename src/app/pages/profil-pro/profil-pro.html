<div class="profilpro-container" >
  <h1 class="profilpro-title">Profil Pro</h1>

  <p class="profil-firstname">
    {{global.user.nom}}
  </p>
  <button mat-button [routerLink]="['/update/:nom']">
    Modifier le nom
  </button>
  
  
  <p class="profil-name">
    {{global.user.prenom}}
  </p>
  <button mat-button [routerLink]="['/update/:prenom']">
    Modifier le prénom
  </button>

  <p class="profil-age">
    {{global.user.age}}
  </p>
  <button mat-button [routerLink]="['/update/:age']">
    Modifier l'âge
  </button>

  <p class="profil-email">
    {{global.user.email}}

  </button>

  <button mat-button [routerLink]="['/update/:password']">

  <button mat-button [routerLink]="['/update-pro/:ville']">

  </p>
  <button mat-button [routerLink]="['/update-pro/:description']">

  </button>
  
  <p class="profilpro-horraire-cabinet">
