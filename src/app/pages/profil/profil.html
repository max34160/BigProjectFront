<div class="page-wrapper">

  <!-- Avatar -->
  <div class="avatar-section">
    <div class="avatar-circle">
      <mat-icon class="avatar-icon">person</mat-icon>
    </div>
    <p class="avatar-name">{{ global.user.prenom }} {{ global.user.nom }}</p>
  </div>

  <!-- Infos -->
  <div class="info-card">

    <div class="info-row">
      <div class="info-content">
        <span class="info-label">Nom</span>
        <span class="info-value">{{ global.user.nom }}</span>
      </div>
      <button mat-icon-button class="edit-btn" [routerLink]="['/update/:nom']">
        <mat-icon>edit</mat-icon>
      </button>
    </div>

    <div class="info-divider"></div>

    <div class="info-row">
      <div class="info-content">
        <span class="info-label">Prénom</span>
        <span class="info-value">{{ global.user.prenom }}</span>
      </div>
      <button mat-icon-button class="edit-btn" [routerLink]="['/update/:prenom']">
        <mat-icon>edit</mat-icon>
      </button>
    </div>

    <div class="info-divider"></div>

    <div class="info-row">
      <div class="info-content">
        <span class="info-label">Âge</span>
        <span class="info-value">{{ global.user.age }} ans</span>
      </div>
      <button mat-icon-button class="edit-btn" [routerLink]="['/update/:age']">
        <mat-icon>edit</mat-icon>
      </button>
    </div>

    <div class="info-divider"></div>

    <div class="info-row">
      <div class="info-content">
        <span class="info-label">Email</span>
        <span class="info-value">{{ global.user.email }}</span>
      </div>
      <button mat-icon-button class="edit-btn" [routerLink]="['/update/:email']">
        <mat-icon>edit</mat-icon>
      </button>
    </div>

    <div class="info-divider"></div>

    <div class="info-row">
      <div class="info-content">
        <span class="info-label">Mot de passe</span>
        <span class="info-value">••••••••</span>
      </div>
      <button mat-icon-button class="edit-btn" [routerLink]="['/update/:password']">
        <mat-icon>edit</mat-icon>
      </button>
    </div>

  </div>

  <!-- Actions -->
  <button mat-flat-button class="btn-pro" [routerLink]="['/verif-pro']">
    <mat-icon>verified</mat-icon>
    Passer Pro
  </button>

  <button mat-stroked-button class="btn-logout" (click)="global.logout()">
    <mat-icon>logout</mat-icon>
    Se déconnecter
  </button>

</div>
