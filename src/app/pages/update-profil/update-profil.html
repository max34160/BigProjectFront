<div class="update-profil-container">
  <h1 class="update-profil-title">Modifier le profil</h1>

  <form class="update-profil-form" (ngSubmit)="submit()">
    <div class="form-group">
      <label for="nom">Nom</label>
      <input id="nom" [(ngModel)]="form.nom" name="nom" placeholder="Nom" />
    </div>

    <div class="form-group">
      <label for="prenom">Prénom</label>
      <input id="prenom" [(ngModel)]="form.prenom" name="prenom" placeholder="Prénom" />
    </div>

    <div class="form-group">
      <label for="age">Âge</label>
      <input id="age" [(ngModel)]="form.age" name="age" placeholder="Âge" />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" [(ngModel)]="form.email" name="email" placeholder="Email" type="email" />
    </div>

    <button type="submit" class="submit-btn">Enregistrer</button>
  </form>
</div>
